[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "CrewAI multi-agent software engineering workflow"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai",
    "llm>=0.32.1",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
software-factory = "software_factory.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
